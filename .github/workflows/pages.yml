name: Build Gecko WASM and deploy Wii Web

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Wii Web site
        uses: actions/checkout@v4

      - name: Checkout Gecko emulator source
        uses: actions/checkout@v4
        with:
          repository: ioncodes/gecko
          path: gecko-src

      - name: Initialize Gecko submodules
        working-directory: gecko-src
        run: |
          git submodule update --init --depth 1 --recursive submodules/chipi-spec
          git submodule update --init --depth 1 --recursive submodules/solstice
          git submodule update --init --depth 1 submodules/dolphin

      - name: Patch Gecko web frontend for Wii ISO/RVZ boot
        run: python3 scripts/patch-gecko-web.py

      - name: Install Rust WebAssembly target
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            gecko-src/target
          key: gecko-wasm-${{ runner.os }}-${{ hashFiles('gecko-src/**/Cargo.lock') }}
          restore-keys: |
            gecko-wasm-${{ runner.os }}-

      - name: Build Gecko WebAssembly runtime
        working-directory: gecko-src
        run: wasm-pack build crates/web --target web --out-dir pkg --out-name gecko_web --release

      - name: Checkout streaming-reader test branch
        uses: actions/checkout@v4
        with:
          repository: Frozican/gecko
          ref: feat/browser-disc-streaming
          path: reader-src

      - name: Initialize test-reader submodules
        working-directory: reader-src
        run: |
          git submodule update --init --depth 1 --recursive submodules/chipi-spec
          git submodule update --init --depth 1 --recursive submodules/solstice
          git submodule update --init --depth 1 submodules/dolphin

      - name: Build streaming-reader WASM
        working-directory: reader-src
        run: wasm-pack build crates/web --target web --out-dir pkg --out-name gecko_web --release

      - name: Assemble static website
        run: |
          mkdir -p gecko reader-test
          cp gecko-src/crates/web/index.html gecko/index.html
          cp -r gecko-src/crates/web/pkg gecko/pkg
          cp reader-src/crates/web/browser-disc-reader-test.html reader-test/index.html
          cp -r reader-src/crates/web/pkg reader-test/pkg
          rm -rf gecko-src reader-src

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
