<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NKit Gap Probe</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;line-height:1.5}button,input{font:inherit;padding:10px;margin:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f2f2;color:#111;padding:14px;border-radius:8px}</style></head><body><h1>NKit post-FST gap probe</h1><p>This test estimates the preserved-hash mask after the FST and reads the first encoded gap header. It reads only small ranges and does not upload or copy the full ISO.</p><label for="iso">Select Super Mario Galaxy NKit ISO:</label><br><input id="iso" type="file" accept=".iso,.nkit.iso,application/octet-stream"><br><button id="run">Probe NKit gap</button><pre id="out">Choose the file, then run the probe.</pre><script>const input=document.getElementById("iso"),out=document.getElementById("out");document.getElementById("run").onclick=()=>{const f=input.files?.[0];if(!f){out.textContent="Select the ISO first.";return;}out.textContent="Reading metadata and first gap header…";const w=new Worker("./wii-nkit-gap-probe-worker.js");w.onmessage=e=>{out.textContent=e.data;w.terminate();};w.onerror=e=>{out.textContent="Worker error: "+e.message;w.terminate();};w.postMessage({file:f});};</script></body></html>
