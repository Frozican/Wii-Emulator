<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NKit Gap Probe</title><style>body{font:16px system-ui,sans-serif;max-width:850px;margin:24px auto;padding:0 16px;line-height:1.5}button,input{font:inherit;padding:10px;margin:6px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f2f2;color:#111;padding:14px;border-radius:8px}</style></head><body><h1>NKit FST file-boundary probe</h1><p>This diagnostic reads small byte windows around the FST end and first file offset to determine how NKit gap data is laid out. It does not upload or copy the full ISO.</p><label for="iso">Select Super Mario Galaxy NKit ISO:</label><br><input id="iso" type="file" accept=".iso,.nkit.iso,application/octet-stream"><br><button id="run">Probe NKit file offsets</button><pre id="out">Choose the file, then run the probe.</pre><script>const input=document.getElementById("iso"),out=document.getElementById("out");document.getElementById("run").onclick=()=>{const f=input.files?.[0];if(!f){out.textContent="Select the ISO first.";return;}out.textContent="Reading NKit metadata and byte windows…";const w=new Worker("./wii-nkit-gap-probe-worker.js?v=3");w.onmessage=e=>{out.textContent=e.data;w.terminate();};w.onerror=e=>{out.textContent="Worker error: "+e.message;w.terminate();};w.postMessage({file:f});};</script></body></html>
